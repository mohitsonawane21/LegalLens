{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="eyebrow">Error {{ code }}</div>
<h1 class="pagetitle">{{ 'Access denied' if code==403 else 'Not found' }}</h1>
<p class="pagesub">{{ msg }}</p>
<a class="btn" href="{{ url_for('home') }}">Back to Home</a>
{% endblock %}
